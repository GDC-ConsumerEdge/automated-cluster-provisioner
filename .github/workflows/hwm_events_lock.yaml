name: HWM Events Lock
on:
  pull_request:
    types: [opened, synchronize, reopened]
run-name: install-hwm-events-lock

permissions:
  contents: read

jobs:
  install-hwm-events-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the hash-locked requirements
        run: |
          python3 -m pip install --require-hashes -r hwm-events/src/requirements.txt
          python3 -m pip check
